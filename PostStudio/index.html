<title>Studio příspěvků</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen mobile app. Home = list of posts. Editor = pinned live preview of the
   1080×1350 slide on top, horizontal slide strip, scrolling field panel beneath. Dark-first,
   because the slides themselves are navy; the UI stays a half step darker so the artwork reads. */
:root{
  --bg:#070B16; --surface:#0D1322; --surface-2:#131A2E; --line:#1C2440; --line-strong:#2A3558;
  --fg:#E9EEF8; --fg-2:#AAB6D2; --muted:#6E7EA6;
  --accent:#5CE1E6; --accent-ink:#06121C; --accent-dim:rgba(92,225,230,.14);
  --warn:#E6B54A; --danger:#E86A6A; --ok:#60CE80;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-brand:'Montserrat',system-ui,-apple-system,sans-serif;
  --r:10px; --gutter:16px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#E8ECF4; --line:#D8DEEA; --line-strong:#C1C9DB;
    --fg:#0F172B; --fg-2:#3D4A6B; --muted:#6B7899;
    --accent:#0C949A; --accent-ink:#FFFFFF; --accent-dim:rgba(12,148,154,.12);
    --warn:#8F6300; --danger:#C53B3B; --ok:#1E8A48; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#E8ECF4; --line:#D8DEEA; --line-strong:#C1C9DB;
  --fg:#0F172B; --fg-2:#3D4A6B; --muted:#6B7899;
  --accent:#0C949A; --accent-ink:#FFFFFF; --accent-dim:rgba(12,148,154,.12);
  --warn:#8F6300; --danger:#C53B3B; --ok:#1E8A48; color-scheme:light;
}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}

/* ---- Top bar ---- */
.bar{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px var(--gutter);border-bottom:1px solid var(--line);flex:none}
.bar .ttl{font-family:var(--font-brand);font-weight:700;font-size:17px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar input.ttl{background:none;border:0;padding:6px 0;border-radius:0;min-width:0;width:100%}
.bar input.ttl:focus{outline:none;box-shadow:inset 0 -2px 0 var(--accent)}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--fg-2);flex:none}
.ib:active{background:var(--surface-2)}
.ib.acc{color:var(--accent)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- Home ---- */
.home-head{padding:28px var(--gutter) 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.home-head h1{margin:0;font-family:var(--font-brand);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.home-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.list{flex:1;overflow:auto;padding:0 var(--gutter) 24px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row .th{width:54px;height:67px;border-radius:5px;background:#070F28;flex:none;overflow:hidden;border:1px solid var(--line-strong)}
.row .th img{width:100%;height:100%;object-fit:cover;display:block}
.row .m{flex:1;min-width:0}
.row .n{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--muted);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.row .more{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.row .more svg{width:20px;height:20px;fill:currentColor}
.empty{padding:48px 0;color:var(--muted);text-align:center;font-size:14px}
.fab{position:absolute;right:var(--gutter);bottom:calc(20px + env(safe-area-inset-bottom,0px));height:52px;padding:0 22px 0 18px;border-radius:26px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.fab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* ---- Editor ---- */
.preview{flex:none;padding:12px var(--gutter) 8px;display:flex;flex-direction:column;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.canvas-wrap{position:relative;height:min(42vh,420px);aspect-ratio:4/5;max-width:100%}
.canvas-wrap canvas{width:100%;height:100%;display:block;border-radius:6px;border:1px solid var(--line-strong);background:#070F28}
.checks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:22px;max-width:100%}
.chip{font-variant-numeric:tabular-nums;font-size:11.5px;line-height:1;padding:5px 8px;border-radius:4px;background:var(--surface-2);color:var(--fg-2);display:inline-flex;align-items:center;gap:5px}
.chip.w{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.chip.ok{color:var(--ok)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

.strip{flex:none;display:flex;gap:8px;padding:10px var(--gutter);overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.th-btn{flex:none;width:48px;height:60px;border-radius:5px;overflow:hidden;border:1.5px solid var(--line-strong);background:#070F28;position:relative;opacity:.72}
.th-btn img{width:100%;height:100%;display:block;object-fit:cover}
.th-btn.on{border-color:var(--accent);opacity:1}
.th-btn .k{position:absolute;left:0;bottom:0;right:0;font-size:9px;font-weight:700;letter-spacing:.06em;text-align:center;background:rgba(7,15,40,.8);color:#fff;padding:2px 0}
.th-add{flex:none;width:48px;height:60px;border-radius:5px;border:1.5px dashed var(--line-strong);display:grid;place-items:center;color:var(--muted)}
.th-add svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

.panel{flex:1;overflow:auto;padding:0 var(--gutter) calc(32px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sec{padding:16px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec h3{margin:0;font-family:var(--font-brand);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec .lnk{font-size:13px;color:var(--accent);font-weight:500}
.f{display:flex;flex-direction:column;gap:6px;padding:8px 0}
.f label{font-size:12.5px;color:var(--fg-2);display:flex;justify-content:space-between;align-items:baseline}
.f label output{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.f label .hint{color:var(--muted);font-size:11.5px}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;font-size:16px;line-height:1.35;min-width:0}
.in:focus{outline:none;border-color:var(--accent)}
textarea.in{resize:none;min-height:88px;font-family:var(--font-brand);font-weight:600}
textarea.in.plain{font-family:var(--font-ui);font-weight:400}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0;height:28px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:0 10px}
.inline{display:flex;gap:8px;align-items:center}
.inline .in{flex:1}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.sw .t{font-size:15px}
.sw .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.tg{width:46px;height:28px;border-radius:14px;background:var(--line-strong);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.tg[aria-checked="true"]{background:var(--accent)}
.tg[aria-checked="true"]::after{transform:translateX(18px)}
@media (prefers-reduced-motion:reduce){.tg,.tg::after,.sheet,.toast{transition:none}}

.card-ed{border:1px solid var(--line);border-radius:var(--r);padding:4px 12px 10px;margin:8px 0;background:var(--surface)}
.card-ed .hd{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;padding-top:8px}
.card-ed .hd b{font-weight:600;color:var(--fg-2)}
.card-ed .in{background:var(--bg)}
.mini{display:flex;gap:4px}
.mini button{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.mini button:active{background:var(--surface-2)}
.mini svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.add-line{width:100%;padding:12px;border:1px dashed var(--line-strong);border-radius:var(--r);color:var(--fg-2);font-size:14px;font-weight:500;margin-top:6px}

.photo-box{display:flex;gap:12px;align-items:center;padding:8px 0}
.photo-box .pv{width:72px;height:72px;border-radius:8px;background:var(--surface-2);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--muted)}
.photo-box .pv img{width:100%;height:100%;object-fit:cover;display:block}
.photo-box .pv svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6}
.photo-box .acts{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:var(--r);font-weight:600;font-size:14.5px;border:1px solid var(--line-strong);color:var(--fg);background:var(--surface);min-height:44px}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.d{color:var(--danger)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13.5px}
.btn:disabled{opacity:.45}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tools{display:flex;gap:8px;padding:14px 0 4px;flex-wrap:wrap}
.tools .btn{flex:1;min-width:0}
.note{color:var(--muted);font-size:12.5px;line-height:1.45;padding:4px 0 8px}
.cs{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid rgba(255,255,255,.15)}

/* ---- Sheets ---- */
.scrim{position:absolute;inset:0;background:rgba(3,6,14,.6);opacity:0;pointer-events:none;transition:opacity .18s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:16px 16px 0 0;border-top:1px solid var(--line-strong);
  transform:translateY(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:21;max-height:88%;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:10px auto 2px}
.sheet .sh{padding:10px var(--gutter) 6px;display:flex;align-items:center;justify-content:space-between}
.sheet .sh h2{margin:0;font-family:var(--font-brand);font-size:16px;font-weight:700}
.sheet .body{overflow:auto;padding:0 var(--gutter) 20px;-webkit-overflow-scrolling:touch}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .ic{width:40px;height:50px;border-radius:4px;background:#070F28;flex:none;border:1px solid var(--line-strong);position:relative;overflow:hidden}
.opt .t{font-weight:600;font-size:15px}
.opt .s{color:var(--muted);font-size:12.5px;margin-top:1px}
.opt.d .t{color:var(--danger)}
.opt.ar .t{color:var(--warn)}
.cap{white-space:pre-wrap;font-size:14px;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:8px 0;word-break:break-word}
.stack{display:flex;flex-direction:column;gap:8px}
.toast{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);
  padding:10px 14px;border-radius:8px;font-size:13.5px;font-weight:500;z-index:30;transition:all .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>

<div id="app">
  <!-- HOME -->
  <section class="screen" id="scr-home">
    <div class="home-head">
      <div>
        <h1>Příspěvky</h1>
        <div class="sub" id="home-sub">@matejjankovic · 1080 × 1350</div>
      </div>
    </div>
    <div class="list" id="post-list"></div>
    <button class="fab" id="btn-new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nový příspěvek</button>
  </section>

  <!-- EDITOR -->
  <section class="screen" id="scr-edit" hidden>
    <div class="bar">
      <button class="ib" id="btn-back" aria-label="Zpět na seznam"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <input class="ttl" id="post-title" placeholder="Název příspěvku" autocomplete="off">
      <button class="ib acc" id="btn-export" aria-label="Export"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg></button>
    </div>
    <div class="preview">
      <div class="canvas-wrap">
        <canvas id="cv" width="1080" height="1350"></canvas>
      </div>
      <div class="checks" id="checks"></div>
    </div>
    <div class="strip" id="strip"></div>
    <div class="panel" id="panel"></div>
  </section>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sh"><h2 id="sheet-title"></h2><button class="ib" id="sheet-close" aria-label="Zavřít"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="body" id="sheet-body"></div>
  </div>
  <div class="toast" id="toast"></div>
  <input type="file" id="file-in" accept="image/*" hidden>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* =========================================================
   KONSTANTY (podle produkčního manuálu, neměnit)
   ========================================================= */
const W = 1080, H = 1350;
const NAVY = '#070F28', CYAN = '#5CE1E6', WHITE = '#FFFFFF', MUTED = '#6484B6', MUTED_LIGHT = '#C8D2DE';
const GOLD = '#DEB23C', GREEN = '#60CE80', RED = '#E85858', CARD_FILL = '#141C2C', CARD_OUTLINE = '#28344A';
const LEFT_X = 68, MAXW = W - 2 * LEFT_X;
const FAM = 'Montserrat';
const F = (w, s) => `${w} ${s}px ${FAM}, sans-serif`;
const BOLD = 700, SEMI = 600, REG = 400;
const ONE_LETTER = new Set('kKsSvVzZoOuUaAiI'.split(''));

const PARTIES = [
  ['ANO', '#704AB8'], ['STAN', '#D61E6B'], ['ODS', '#3B6ED6'], ['SPOLU pro Prahu', '#48D66E'], ['SPD', '#B06E2B'],
  ['Piráti', '#7D7D84'], ['Motoristé sobě', '#3B96DC'], ['TOP 09', '#CE8CBE'], ['KDU-ČSL', '#C8C43C'], ['Naše Česko', '#50AFB9'],
  ['KSČM', '#CC2A2A'], ['Stačilo!', '#9E203E'], ['Zelení', '#5CB052'], ['Přísaha', '#3452C8'], ['Svobodní', '#48A27A'],
  ['PRO', '#60AC8C'], ['Praha sobě', '#F5D000'], ['SEN pro Prahu', '#CC3C3C'], ['ostatní', '#566276'],
  ['AfD', '#4DA6DE'], ['CDU', '#96969E'], ['Die Linke', '#BA3A74'], ['SPD (DE)', '#D62C2C'], ['Grüne', '#5CB052'], ['BSW', '#E89648'], ['FDP', '#E8CE32'],
];

/* =========================================================
   STAV A ULOŽIŠTĚ
   ========================================================= */
const LS_KEY = 'mj-studio-v1';
let state = { posts: [], currentId: null, slideIdx: 0 };
const imgCache = new Map();

function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.posts)) state = Object.assign(state, s); }
  } catch (e) { /* bez úložiště běžíme dál */ }
  if (!state.posts.length) state.posts = [samplePost()];
}
let saveT = null;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    catch (e) { toast('Koncept se nepodařilo uložit (málo místa v prohlížeči). Zmenši nebo odeber fotky.'); }
  }, 300);
}

function newSlide(type) {
  const base = { id: uid(), type, photo: null, arrows: false };
  if (type === 'cover') return Object.assign(base, { headline: 'Nový nadpis, [klíčová fráze] zvýrazněná', size: 0, maxH: 620, crop: 0.1, gs: 0.62, ge: 1.0 });
  if (type === 'quote') return Object.assign(base, { label: '', text: 'Text citátu, [šťavnatá část] zvýrazněná.', name: 'Jméno Příjmení', role: 'funkce', size: 0, topGap: 110, maxH: 480, crop: 0.1, gs: 0.6, ge: 1.0 });
  if (type === 'cards') return Object.assign(base, { title: 'Co to znamená', items: [{ title: 'Titulek karty', body: 'Jedna až dvě věty, neutrálně a věcně.' }, { title: 'Druhá karta', body: 'Krátké shrnutí druhého bodu.' }], maxH: 320, crop: 0.1, gs: 0.55, ge: 1.0 });
  if (type === 'chart') return Object.assign(base, { title1: 'Koho by lidé volili,', title2: 'kdyby byly volby teď?', subtitle: 'Agentura, sběr 1. až 15. měsíce 2026', threshold: true, changes: false, barH: 50,
    rows: [{ name: 'ANO', value: 30, change: 0, color: '#704AB8' }, { name: 'SPOLU', value: 20, change: 0, color: '#3B6ED6' }, { name: 'STAN', value: 10, change: 0, color: '#D61E6B' }] });
  return base;
}
function newPost(title) {
  const s = newSlide('cover'); s.arrows = true;
  return { id: uid(), title: title || 'Nový příspěvek', created: Date.now(), updated: Date.now(), slides: [s], caption: { intro: '', source: '', date: '', photo: '', tags: '' }, thumb: null };
}
function samplePost() {
  const p = newPost('Ukázkový příspěvek');
  const c = p.slides[0];
  c.headline = 'Takto vypadá [titulní slide] s fotkou a zvýrazněnou frází';
  const q = newSlide('quote'); q.label = 'K ukázkovému výroku'; q.text = 'Tady je ukázkový citát. Část, kterou chceš [zvýraznit, dej do hranatých závorek].'; q.name = 'Jméno Příjmení'; q.role = 'Příklad, nahraď vlastním';
  const k = newSlide('cards'); k.title = 'Jak se s aplikací pracuje'; k.items = [
    { title: 'Text píšeš dole', body: 'Náhled se překresluje průběžně, hranaté závorky obarví frázi.' },
    { title: 'Fotku nahraješ z telefonu', body: 'Posuvníky řídí výřez, výšku a plynulost přechodu do navy.' },
    { title: 'Export v pravém horním rohu', body: 'PNG v přesném rozměru 1080 × 1350, plus hotový popisek.' }];
  const g = newSlide('chart'); g.subtitle = 'Ukázková data, nahraď vlastními'; g.changes = true;
  g.rows = [{ name: 'ANO', value: 32.5, change: 1.2, color: '#704AB8' }, { name: 'SPOLU', value: 19, change: -0.8, color: '#3B6ED6' }, { name: 'SPD', value: 12.5, change: 0, color: '#B06E2B' },
    { name: 'STAN', value: 10, change: 0.5, color: '#D61E6B' }, { name: 'Piráti', value: 8.5, change: 0.3, color: '#7D7D84' }, { name: 'Stačilo!', value: 5.5, change: -0.4, color: '#9E203E' }, { name: 'Motoristé sobě', value: 4, change: -0.2, color: '#3B96DC' }];

$('panel').addEventListener('click', e => {

/* ---- Fotka z telefonu ---- */
$('file-in').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    const MAXW_SRC = 1620;
    const sc = Math.min(1, MAXW_SRC / img.naturalWidth);
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const s = curSlide();
    s.photo = { src: c.toDataURL('image/jpeg', 0.86), w: img.naturalWidth, h: img.naturalHeight, zoom: 1, cx: 0.5 };
    if (img.naturalWidth < 600) toast('Fotka je užší než 600 px, na slidu bude měkká.');
    renderPanel(); touch();
  } catch (err) { toast('Fotku se nepodařilo načíst.'); }
});

let dlCap = undefined;
async function getDownloads() {
  if (dlCap !== undefined) return dlCap;
  try { dlCap = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dlCap = null; }
  return dlCap;
}

  const dl = await getDownloads();
  if (dl) { await dl.save({ filename, data: blob }); return true; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);

}

  const lines = [];
  lines.push((c.intro || '').trim());
  lines.push('', 'Zajímá mě tvůj názor, napiš mi ho do komentářů!', '', '👆 Nezapomeň mě sledovat pro tvůj větší přehled a buď o krok napřed!', '');
  lines.push('Zdroj: ' + [c.source, c.date].filter(Boolean).join(' · '));
  if (c.photo) lines.push('Foto: ' + c.photo);
  lines.push('', tags.slice(0, 5).join(' '));

}

      <button class="btn" data-x="zip" ${n < 2 ? 'disabled' : ''}>Uložit vše jako ZIP</button>
    </div>
    <div class="note">PNG 1080 × 1350 px, watermark na každém slidu. Na iPhonu se otevře sdílení, odkud jde rovnou do Fotek.</div>
    <div class="sec"><h3>Popisek</h3><span class="hint" style="color:${cap.tagCount > 5 ? 'var(--warn)' : 'var(--muted)'};font-size:12px">${cap.tagCount > 5 ? 'max 5 hashtagů, zbytek se odřízne' : 'tykání, zdroj, max 5 hashtagů'}</span></div>
    ${fArea('Faktický úvod (2 až 5 vět)', 'cap.intro', p.caption.intro, '', true)}
    <div class="grid2">${fText('Zdroj', 'cap.source', p.caption.source, 'ČTK')}${fText('Datum', 'cap.date', p.caption.date, '1. října 2026')}</div>
    ${fText('Foto (volitelné)', 'cap.photo', p.caption.photo, 'ČTK, Profimedia')}
    ${fText('Hashtagy', 'cap.tags', p.caption.tags, 'politika cesko eu', 'bez diakritiky, oddělené mezerou')}
    <div class="cap" id="cap-out">${esc(cap.text)}</div>
    <button class="btn" data-x="copy" style="width:100%">Kopírovat popisek</button>`);
  const body = $('sheet-body');
  body.addEventListener('input', e => {
    const f = e.target.dataset.f; if (!f || !f.startsWith('cap.')) return;
    p.caption[f.slice(4)] = e.target.value; p.updated = Date.now(); save();
    const c2 = buildCaption(p); $('cap-out').textContent = c2.text;
  });
  body.onclick = async e => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    const x = b.dataset.x; const base = slug(p.title);
    try {
      if (x === 'copy') {
        const t = buildCaption(p).text;
        try { await navigator.clipboard.writeText(t); toast('Popisek zkopírován'); }
        catch (err) { const r = document.createRange(); r.selectNodeContents($('cap-out')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Označeno, zkopíruj ručně'); }
      } else if (x === 'one') {
        const s = curSlide(); const i = p.slides.indexOf(s);
        b.disabled = true; await saveFile(`${base}-${String(i + 1).padStart(2, '0')}.png`, await slideBlob(s)); b.disabled = false; toast('Slide uložen');
      } else if (x === 'all') {
        b.disabled = true;
        for (let i = 0; i < p.slides.length; i++) { b.textContent = `Ukládám ${i + 1} / ${p.slides.length}…`; await saveFile(`${base}-${String(i + 1).padStart(2, '0')}.png`, await slideBlob(p.slides[i])); }
        b.textContent = `Uložit všech ${p.slides.length} slidů po jednom`; b.disabled = false; toast('Všechny slidy uloženy');
      } else if (x === 'zip') {
        if (typeof JSZip === 'undefined') { toast('ZIP knihovna se nenačetla, ulož slidy po jednom.'); return; }
        b.disabled = true; b.textContent = 'Balím…';
        const z = new JSZip();
        for (let i = 0; i < p.slides.length; i++) z.file(`${base}-${String(i + 1).padStart(2, '0')}.png`, await slideBlob(p.slides[i]));
        z.file('popisek.txt', buildCaption(p).text);
        const blob = await z.generateAsync({ type: 'blob' });
        await saveFile(`${base}.zip`, blob); b.textContent = 'Uložit vše jako ZIP'; b.disabled = false; toast('ZIP uložen');
      }
    } catch (err) {
      b.disabled = false; if (x === 'all') b.textContent = `Uložit všech ${p.slides.length} slidů po jednom`; if (x === 'zip') b.textContent = 'Uložit vše jako ZIP';
      const code = err && err.code;
      if (code === 'declined') toast('Ukládání zrušeno');
      else if (code === 'rate_limited') toast('Počkej chvíli a zkus to znovu');
      else toast('Soubor se nepodařilo uložit' + (err && err.message ? ': ' + err.message : ''));
    }
  };
}
$('btn-export').onclick = exportSheet;

/* =========================================================
   START
   ========================================================= */
load();
renderHome();
if (state.currentId && cur()) openPost(state.currentId); else { state.currentId = null; }
ensureFonts();
window.addEventListener('resize', scheduleRender);
</script>
