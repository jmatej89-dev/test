<title>Studio příspěvků</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen mobile app over a soft, blurred color field. Glass surfaces (top bar, slide strip,
   field sheet, bottom sheets) float above it. The 1080×1350 slide is the one solid, dark object on screen.
   Light is the primary theme (the client asked for a light Liquid Glass look); dark mirrors it. */
:root{
  --bg:#E9EDF5; --blob-a:rgba(92,225,230,.55); --blob-b:rgba(120,140,235,.35); --blob-c:rgba(255,214,170,.55);
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.86); --glass-line:rgba(255,255,255,.85); --glass-edge:rgba(20,30,60,.08);
  --shadow:0 12px 32px rgba(20,30,60,.12),0 1px 2px rgba(20,30,60,.06);
  --fg:#0B1226; --fg-2:#3C4866; --muted:#6B7693; --line:rgba(20,30,60,.1);
  --field:rgba(255,255,255,.7); --field-line:rgba(20,30,60,.12); --card:rgba(255,255,255,.28);
  --accent:#0A9EA6; --accent-soft:rgba(92,225,230,.28); --accent-ink:#FFFFFF;
  --warn:#9A6400; --warn-soft:rgba(230,181,74,.22); --danger:#C73A3A; --ok:#1F8A4C; --ok-soft:rgba(96,206,128,.22);
  --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  --font-brand:'Montserrat',-apple-system,system-ui,sans-serif;
  --r-glass:22px; --r-field:14px; --gutter:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090D1A; --blob-a:rgba(92,225,230,.22); --blob-b:rgba(100,120,230,.22); --blob-c:rgba(255,190,120,.14);
    --glass:rgba(22,30,52,.55); --glass-2:rgba(22,30,52,.8); --glass-line:rgba(255,255,255,.14); --glass-edge:rgba(0,0,0,.3);
    --shadow:0 12px 32px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    --fg:#EDF1FA; --fg-2:#B3BDD6; --muted:#7D89A8; --line:rgba(255,255,255,.1);
    --field:rgba(255,255,255,.07); --field-line:rgba(255,255,255,.12); --card:rgba(255,255,255,.03);
    --accent:#5CE1E6; --accent-soft:rgba(92,225,230,.18); --accent-ink:#06121C;
    --warn:#E6B54A; --warn-soft:rgba(230,181,74,.16); --danger:#F07878; --ok:#6ED48E; --ok-soft:rgba(96,206,128,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090D1A; --blob-a:rgba(92,225,230,.22); --blob-b:rgba(100,120,230,.22); --blob-c:rgba(255,190,120,.14);
  --glass:rgba(22,30,52,.55); --glass-2:rgba(22,30,52,.8); --glass-line:rgba(255,255,255,.14); --glass-edge:rgba(0,0,0,.3);
  --shadow:0 12px 32px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
  --fg:#EDF1FA; --fg-2:#B3BDD6; --muted:#7D89A8; --line:rgba(255,255,255,.1);
  --field:rgba(255,255,255,.07); --field-line:rgba(255,255,255,.12); --card:rgba(255,255,255,.03);
  --accent:#5CE1E6; --accent-soft:rgba(92,225,230,.18); --accent-ink:#06121C;
  --warn:#E6B54A; --warn-soft:rgba(230,181,74,.16); --danger:#F07878; --ok:#6ED48E; --ok-soft:rgba(96,206,128,.16);
  color-scheme:dark;
}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

#bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg i{position:absolute;border-radius:50%;filter:blur(70px)}
#bg .a{width:70vw;height:70vw;max-width:520px;max-height:520px;background:var(--blob-a);left:-18vw;top:-10vh}
#bg .b{width:62vw;height:62vw;max-width:480px;max-height:480px;background:var(--blob-b);right:-20vw;top:30vh}
#bg .c{width:60vw;height:60vw;max-width:460px;max-height:460px;background:var(--blob-c);left:10vw;bottom:-18vh}

#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;position:relative;z-index:1}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--glass-line);box-shadow:var(--shadow),inset 0 0 0 1px var(--glass-edge);border-radius:var(--r-glass)}

/* ---- Top bar ---- */
.bar{display:flex;align-items:center;gap:6px;min-height:54px;padding:6px 8px 6px 6px;margin:10px var(--gutter) 0;flex:none;border-radius:999px}
.bar .ttl{font-family:var(--font-brand);font-weight:700;font-size:16px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar input.ttl{background:none;border:0;padding:8px 6px;border-radius:10px;min-width:0;width:100%}
.bar input.ttl:focus{outline:none;background:var(--field)}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--fg-2);flex:none}
.ib:active{background:var(--field)}
.ib.acc{color:var(--accent)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---- Home ---- */
.home-head{padding:34px var(--gutter) 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex:none}
.home-head h1{margin:0;font-family:var(--font-brand);font-weight:700;font-size:30px;letter-spacing:-.025em;line-height:1.05}
.home-head .sub{color:var(--muted);font-size:13px;margin-top:5px;font-variant-numeric:tabular-nums}
.list{flex:1;overflow:auto;padding:4px var(--gutter) calc(110px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px}
.post{display:flex;align-items:center;gap:14px;padding:12px 10px 12px 12px;width:100%;text-align:left}
.post .th{width:56px;height:70px;border-radius:9px;background:#070F28;flex:none;overflow:hidden;box-shadow:0 2px 8px rgba(7,15,40,.25)}
.post .th img{width:100%;height:100%;object-fit:cover;display:block}
.post .m{flex:1;min-width:0}
.post .n{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.post .d{color:var(--muted);font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums}
.post .more{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.post .more svg{width:20px;height:20px;fill:currentColor}
.empty{padding:48px 20px;color:var(--muted);text-align:center;font-size:14px;line-height:1.5}
.fabs{position:absolute;left:var(--gutter);right:var(--gutter);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.fabs>*{pointer-events:auto}
.fab{height:54px;padding:0 24px 0 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:8px;
  box-shadow:0 10px 26px rgba(10,158,166,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.fab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round}
.fab.ghost{background:var(--glass);color:var(--fg-2);box-shadow:var(--shadow);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:0 16px}

/* ---- Editor ---- */
.preview{flex:none;padding:12px var(--gutter) 6px;display:flex;flex-direction:column;align-items:center;gap:10px}
.canvas-wrap{position:relative;height:min(41vh,420px);aspect-ratio:4/5;max-width:100%;border-radius:16px;box-shadow:0 18px 40px rgba(7,15,40,.28),0 2px 6px rgba(7,15,40,.15)}
.canvas-wrap canvas{width:100%;height:100%;display:block;border-radius:16px;background:#070F28}
.canvas-wrap.grab{cursor:grab}
.canvas-wrap .gest{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(7,15,40,.7);color:#fff;font-size:11px;padding:5px 10px;border-radius:999px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.canvas-wrap.hinting .gest{opacity:1}
.checks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:24px;max-width:100%}
.chip{font-size:11.5px;line-height:1;padding:6px 10px;border-radius:999px;background:var(--glass-2);color:var(--fg-2);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--glass-line);font-variant-numeric:tabular-nums}
.chip.w{color:var(--warn);background:var(--warn-soft)}
.chip.ok{color:var(--ok);background:var(--ok-soft)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

.strip-wrap{flex:none;padding:4px var(--gutter) 10px}
.strip{display:flex;gap:8px;padding:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-radius:18px;align-items:center}
.strip::-webkit-scrollbar{display:none}
.th-btn{flex:none;width:46px;height:58px;border-radius:9px;overflow:hidden;background:#070F28;position:relative;opacity:.6;transition:opacity .15s,transform .15s}
.th-btn img{width:100%;height:100%;display:block;object-fit:cover}
.th-btn.on{opacity:1;box-shadow:0 0 0 2px var(--accent);transform:scale(1.04)}
.th-btn .k{position:absolute;left:0;bottom:0;right:0;font-size:9px;font-weight:700;letter-spacing:.08em;text-align:center;background:rgba(7,15,40,.78);color:#fff;padding:2px 0;font-family:var(--font-brand)}
.th-add{flex:none;width:46px;height:58px;border-radius:9px;border:1.5px dashed var(--field-line);display:grid;place-items:center;color:var(--muted)}
.th-add svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.strip .sep{width:1px;height:36px;background:var(--line);flex:none;margin:0 2px}
.strip .grid-btn{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg-2)}
.strip .grid-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.panel-wrap{flex:1;min-height:0;padding:0 var(--gutter);display:flex}
.panel{flex:1;overflow:auto;padding:4px 16px calc(28px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;border-radius:var(--r-glass) var(--r-glass) 0 0;border-bottom:0}
.sec{padding:18px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec h3{margin:0;font-family:var(--font-brand);font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:12px}
.sec .hint{text-align:right}
.sec .lnk{font-size:13px;color:var(--accent);font-weight:600}
.f{display:flex;flex-direction:column;gap:6px;padding:7px 0}
.f label{font-size:12.5px;color:var(--fg-2);display:flex;justify-content:space-between;align-items:baseline;font-weight:500}
.f label output{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;font-weight:400}
.in{width:100%;background:var(--field);border:1px solid var(--field-line);border-radius:var(--r-field);padding:11px 13px;font-size:16px;line-height:1.35;min-width:0;box-shadow:inset 0 1px 2px rgba(20,30,60,.04)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in::placeholder{color:var(--muted);opacity:.8}
textarea.in{resize:none;min-height:92px;font-family:var(--font-brand);font-weight:600}
textarea.in.plain{font-family:var(--font-ui);font-weight:400;min-height:0}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--field-line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 2px 8px rgba(20,30,60,.25),0 0 0 1px rgba(20,30,60,.08)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--field-line)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(20,30,60,.25),0 0 0 1px rgba(20,30,60,.08)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:0 10px}
.inline{display:flex;gap:8px;align-items:center}
.inline .in{flex:1}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.sw:last-child{border-bottom:0}
.sw .t{font-size:15px;font-weight:500}
.sw .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.tg{width:50px;height:30px;border-radius:15px;background:var(--field-line);position:relative;flex:none;transition:background .18s;box-shadow:inset 0 1px 2px rgba(20,30,60,.1)}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 2px 6px rgba(20,30,60,.25)}
.tg[aria-checked="true"]{background:var(--accent)}
.tg[aria-checked="true"]::after{transform:translateX(20px)}
@media (prefers-reduced-motion:reduce){.tg,.tg::after,.sheet,.toast,.th-btn{transition:none}}

.card-ed{border:1px solid var(--line);border-radius:16px;padding:4px 12px 10px;margin:8px 0;background:var(--card)}
.card-ed .hd{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;padding-top:8px}
.card-ed .hd b{font-weight:600;color:var(--fg-2);display:flex;align-items:center}
.mini{display:flex;gap:2px}
.mini button{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.mini button:active{background:var(--field)}
.mini button:disabled{opacity:.3}
.mini svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.add-line{width:100%;padding:12px;border:1.5px dashed var(--field-line);border-radius:var(--r-field);color:var(--fg-2);font-size:14px;font-weight:600;margin-top:6px}

.photo-box{display:flex;gap:14px;align-items:center;padding:8px 0}
.photo-box .pv{width:76px;height:76px;border-radius:14px;background:var(--field);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--muted);border:1px solid var(--field-line)}
.photo-box .pv canvas{width:100%;height:100%;display:block}
.photo-box .pv svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6}
.photo-box .acts{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:999px;font-weight:600;font-size:14.5px;border:1px solid var(--field-line);color:var(--fg);background:var(--field);min-height:46px}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 18px rgba(10,158,166,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.d{color:var(--danger)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:13.5px}
.btn:disabled{opacity:.45}
.tools{display:flex;gap:8px;padding:14px 0 4px;flex-wrap:wrap}
.tools .btn{flex:1;min-width:0}
.note{color:var(--muted);font-size:12.5px;line-height:1.45;padding:4px 0 8px}
.cs{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}

/* ---- Sheets ---- */
.scrim{position:absolute;inset:0;background:rgba(10,16,36,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:26px;background:var(--glass-2);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border:1px solid var(--glass-line);box-shadow:var(--shadow);
  transform:translateY(calc(100% + 20px));transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:21;max-height:calc(90% - 8px);display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--field-line);margin:10px auto 0}
.sheet .sh{padding:8px 18px 4px;display:flex;align-items:center;justify-content:space-between}
.sheet .sh h2{margin:0;font-family:var(--font-brand);font-size:17px;font-weight:700;letter-spacing:-.01em}
.sheet .body{overflow:auto;padding:0 18px 18px;-webkit-overflow-scrolling:touch}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .ic{width:42px;height:52px;border-radius:7px;background:#070F28;flex:none;overflow:hidden;box-shadow:0 2px 6px rgba(7,15,40,.25)}
.opt .ic img{width:100%;height:100%;display:block}
.opt .t{font-weight:600;font-size:15px}
.opt .s{color:var(--muted);font-size:12.5px;margin-top:1px}
.opt.d .t{color:var(--danger)}
.cap{white-space:pre-wrap;font-size:14px;line-height:1.5;background:var(--field);border:1px solid var(--field-line);border-radius:var(--r-field);padding:12px 14px;margin:8px 0;word-break:break-word}
.stack{display:flex;flex-direction:column;gap:8px}
.gridall{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 0 10px}
.gridall button{aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:#070F28;position:relative;box-shadow:0 4px 12px rgba(7,15,40,.25)}
.gridall button.on{box-shadow:0 0 0 2.5px var(--accent),0 4px 12px rgba(7,15,40,.25)}
.gridall img{width:100%;height:100%;display:block;object-fit:cover}
.gridall .n{position:absolute;left:6px;top:6px;background:rgba(7,15,40,.75);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px}
.gridall .wb{position:absolute;right:6px;top:6px;width:10px;height:10px;border-radius:50%;background:#E6B54A;box-shadow:0 0 0 2px rgba(7,15,40,.6)}
.wlist{display:flex;flex-direction:column;gap:6px;padding:4px 0 8px}
.wlist div{font-size:13px;color:var(--fg-2);display:flex;gap:8px;align-items:flex-start}
.wlist b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;flex:none;width:20px}
.toast{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);
  padding:11px 16px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:30;transition:all .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>

<div id="bg"><i class="a"></i><i class="b"></i><i class="c"></i></div>
<div id="app">
  <!-- HOME -->
  <section class="screen" id="scr-home">
    <div class="home-head">
      <div>
        <h1>Příspěvky</h1>
        <div class="sub" id="home-sub">@matejjankovic · 1080 × 1350</div>
      </div>
    </div>
    <div class="list" id="post-list"></div>
    <div class="fabs">
      <button class="fab ghost" id="btn-menu" aria-label="Záloha a nastavení"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="fab" id="btn-new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nový příspěvek</button>
    </div>
  </section>

  <!-- EDITOR -->
  <section class="screen" id="scr-edit" hidden>
    <div class="bar glass">
      <button class="ib" id="btn-back" aria-label="Zpět na seznam"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <input class="ttl" id="post-title" placeholder="Název příspěvku" autocomplete="off">
      <button class="ib acc" id="btn-export" aria-label="Export"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg></button>

function setPath(obj, path, val) {

$('panel').addEventListener('input', e => {

  else v = el.value;

  setPath(s, f, v);
  if (f.endsWith('.color')) { const card = el.closest('.card-ed'); const sw = card && card.querySelector('.cs'); if (sw) sw.style.background = v; }
  touch();

$('panel').addEventListener('click', e => {
  const tg = e.target.closest('.tg'); const p = cur(); const s = curSlide();
  if (tg) {
    const on = tg.getAttribute('aria-checked') !== 'true'; tg.setAttribute('aria-checked', on);
    setPath(s, tg.dataset.f, on); touch();

  }

  const a = b.dataset.act, i = +b.dataset.i, idx = p.slides.indexOf(s);
  const swap = (arr, x, y) => { [arr[x], arr[y]] = [arr[y], arr[x]]; };
  const focusLast = sel => setTimeout(() => { const els = $('panel').querySelectorAll(sel); if (els.length) els[els.length - 1].focus(); }, 30);
  const lists = {
    card: ['items', () => ({ title: '', body: '' }), '[data-f$=".title"]'],
    row: ['rows', () => (s.type === 'compare' ? { name: '', old: '', value: '', color: '#566276' } : { name: '', value: '', change: '', color: '#566276' }), '[data-f$=".name"]'],
    seg: ['segs', () => ({ name: '', color: '#566276' }), '[data-f$=".name"]'],
    srow: ['rows', () => ({ label: '', values: '' }), '[data-f$=".label"]'],
  };
  const m = /^(card|row|seg|srow)-(add|rm|up|down)$/.exec(a);
  if (m) {
    const [key, mk, sel] = lists[m[1]]; const arr = s[key];

    else if (m[2] === 'rm') { arr.splice(i, 1); renderPanel(); touch(); }
    else if (m[2] === 'up' && i > 0) { swap(arr, i, i - 1); renderPanel(); touch(); }
    else if (m[2] === 'down' && i < arr.length - 1) { swap(arr, i, i + 1); renderPanel(); touch(); }
    return;
  }
  if (a === 'photo-add') { $('file-in').value = ''; $('file-in').click(); }
  else if (a === 'photo-rm') { const id = s.photo && s.photo.id; s.photo = null; photoRelease(id); renderPanel(); touch(); }
  else if (a === 's-left' && idx > 0) { swap(p.slides, idx, idx - 1); state.slideIdx = idx - 1; renderStrip(); renderPanel(); touch(); }
  else if (a === 's-right' && idx < p.slides.length - 1) { swap(p.slides, idx, idx + 1); state.slideIdx = idx + 1; renderStrip(); renderPanel(); touch(); }
  else if (a === 's-dup') { const c = JSON.parse(JSON.stringify(s)); c.id = uid(); c.arrows = false; p.slides.splice(idx + 1, 0, c); state.slideIdx = idx + 1; renderStrip(); renderPanel(); touch(); }

/* ---- Fotka z telefonu ---- */
$('file-in').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;

    const MAXW_SRC = 1800;
    const sc = Math.min(1, MAXW_SRC / img.naturalWidth);
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);

    const id = uid();

    s.photo = { id, w: img.naturalWidth, h: img.naturalHeight, zoom: 1, cx: 0.5 };
    photoRelease(old);
    if (img.naturalWidth < 600) toast('Fotka je užší než 600 px, na slidu bude měkká.');
    renderPanel(); touch();
  } catch (err) { toast('Fotku se nepodařilo načíst. Zkus JPG nebo PNG.'); }
});

/* ---- Gesta na náhledu: tah = výřez, dva prsty = přiblížení ---- */
(() => {
  const el = $('cvw'); const pts = new Map(); let start = null;
  const sync = () => {
    const s = curSlide(); if (!s || !s.photo) return;
    [['crop', s.crop], ['photo.cx', s.photo.cx], ['photo.zoom', s.photo.zoom || 1]].forEach(([f, v]) => {
      const r = $('panel').querySelector(`[data-f="${f}"]`); if (!r) return; r.value = v;
      const o = r.parentElement.querySelector('output'); if (o) o.textContent = fmtOut(v, r.dataset.unit);
    });
  };
  const snapshot = () => { const s = curSlide(); return { crop: s.crop, cx: s.photo.cx == null ? 0.5 : s.photo.cx, zoom: s.photo.zoom || 1, pts: new Map(pts), geom: previewGeom || (start && start.geom), k: W / el.getBoundingClientRect().width }; };
  el.addEventListener('pointerdown', e => {
    const s = curSlide(); if (!s || !s.photo || !previewGeom) return;
    el.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    start = snapshot(); e.preventDefault();
  });
  el.addEventListener('pointermove', e => {
    if (!start || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const s = curSlide(); if (!s || !s.photo || !start.geom) return;
    const g = start.geom, k = start.k;
    if (pts.size >= 2 && start.pts.size >= 2) {
      const [a0, b0] = Array.from(start.pts.values()), [a1, b1] = Array.from(pts.values());
      const d0 = Math.hypot(a0.x - b0.x, a0.y - b0.y) || 1, d1 = Math.hypot(a1.x - b1.x, a1.y - b1.y);
      s.photo.zoom = Math.round(Math.min(2.5, Math.max(1, start.zoom * d1 / d0)) * 100) / 100;
    } else {
      const p0 = start.pts.get(e.pointerId); if (!p0) return;
      const dx = (e.clientX - p0.x) * k, dy = (e.clientY - p0.y) * k;
      const slackY = g.sh - g.h; if (slackY > 1) s.crop = Math.round(Math.min(1, Math.max(0, start.crop - dy / slackY)) * 1000) / 1000;
      const slackX = W * g.zoom - W; if (slackX > 1) s.photo.cx = Math.round(Math.min(1, Math.max(0, start.cx - dx / slackX)) * 1000) / 1000;
    }
    scheduleRender();
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (!pts.size) { start = null; sync(); touch(); }
    else if (start) start = snapshot();
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.style.touchAction = 'none';
})();

/* =========================================================
   EXPORT + POPISEK
   ========================================================= */
function slug(t) { return String(t || 'post').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'post'; }
function slideBlob(s, p) { renderSlide(offCtx, s, p); return new Promise(r => off.toBlob(r, 'image/png')); }
function contactBlob(p) {
  const n = p.slides.length, cols = Math.min(3, n), rows = Math.ceil(n / cols), cw = 432, chh = 540, pad = 24;
  const c = document.createElement('canvas'); c.width = cols * cw + (cols + 1) * pad; c.height = rows * chh + (rows + 1) * pad;
  const x = c.getContext('2d'); x.fillStyle = '#0B1430'; x.fillRect(0, 0, c.width, c.height);
  p.slides.forEach((s, i) => { renderSlide(offCtx, s, p); x.drawImage(off, pad + (i % cols) * (cw + pad), pad + Math.floor(i / cols) * (chh + pad), cw, chh); });
  return new Promise(r => c.toBlob(r, 'image/png'));
}
let dlCap;
async function getDownloads() {
  if (dlCap !== undefined) return dlCap;
  try { dlCap = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dlCap = null; }
  return dlCap;
}
async function saveFile(filename, blob) {
  const dl = await getDownloads();
  if (dl) { await dl.save({ filename, data: blob }); return true; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return true;
}
function buildCaption(p) {
  const c = p.caption || {};
  const tags = String(c.tags || '').split(/[\s,#]+/).filter(Boolean).map(t => '#' + t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9_]/g, '')).filter(t => t.length > 1);
  const src = 'Zdroj: ' + [c.source, c.date].filter(Boolean).join(' · ');
  const lines = [(c.intro || '').trim()];
  if (!c.short) lines.push('', 'Zajímá mě tvůj názor, napiš mi ho do komentářů!', '', '👆 Nezapomeň mě sledovat pro tvůj větší přehled a buď o krok napřed!');
  lines.push('', src);
  if (c.photo) lines.push('Foto: ' + c.photo);
  lines.push('', tags.slice(0, 5).join(' '));
  const wn = [];
  if (/\b(Vás|Vám|Vaše|myslíte|sledujte|napište|víte)\b/i.test(c.intro || '')) wn.push('Popisek má tykat');
  if (tags.length > 5) wn.push('Max 5 hashtagů, zbytek se odřízne');
  if (!c.source) wn.push('Chybí zdroj');
  return { text: lines.join('\n'), tagCount: tags.length, wn };
}
function postWarnings(p) {
  return p.slides.map((s, i) => ({ i, wn: renderSlide(offCtx, s, p) })).filter(x => x.wn.length);
}
function exportSheet() {
  const p = cur(); const n = p.slides.length;
  const pw = postWarnings(p);
  openSheet('Export', `
    ${pw.length ? `<div class="sec" style="padding-top:4px"><h3>Kontrola před odesláním</h3><span class="hint">${pw.reduce((a, x) => a + x.wn.length, 0)} upozornění</span></div>
      <div class="wlist">${pw.map(x => x.wn.map(w => `<div><b>${x.i + 1}</b><span>${esc(w)}</span></div>`).join('')).join('')}</div>` :
      `<div class="chip ok" style="margin:4px 0 10px"><i></i>Všech ${n} ${plural(n, 'slide prošel', 'slidy prošly', 'slidů prošlo')} kontrolou</div>`}
    <div class="stack">
      <button class="btn p" data-x="one">Uložit tento slide (PNG)</button>
      <button class="btn" data-x="all" ${n < 2 ? 'disabled' : ''}>Uložit všech ${n} slidů po jednom</button>
      <button class="btn" data-x="zip" ${n < 2 ? 'disabled' : ''}>Uložit vše jako ZIP</button>
      <button class="btn" data-x="contact" ${n < 2 ? 'disabled' : ''}>Kontaktní list (PNG)</button>
    </div>
    <div class="note">PNG 1080 × 1350 px, watermark na každém slidu. Na iPhonu se otevře sdílení, odkud jde rovnou do Fotek.</div>
    <div class="sec"><h3>Popisek</h3><span class="hint" id="cap-hint"></span></div>
    ${fArea('Faktický úvod (2 až 5 vět, tykání)', 'cap.intro', p.caption.intro, '', true, 4)}
    <div class="grid2">${fText('Zdroj', 'cap.source', p.caption.source, 'ČTK')}${fText('Datum', 'cap.date', p.caption.date, '1. října 2026')}</div>
    ${fText('Foto (volitelné)', 'cap.photo', p.caption.photo, 'ČTK, Profimedia')}
    ${fText('Hashtagy', 'cap.tags', p.caption.tags, 'politika cesko eu', 'bez diakritiky, max 5')}
    ${fSwitch('Kratší verze', 'jen úvod, zdroj a hashtagy', 'cap.short', !!p.caption.short)}
    <div class="cap" id="cap-out"></div>
    <button class="btn" data-x="copy" style="width:100%">Kopírovat popisek</button>`);
  const body = $('sheet-body');
  const refresh = () => { const c2 = buildCaption(p); $('cap-out').textContent = c2.text; const hnt = $('cap-hint'); hnt.textContent = c2.wn.length ? c2.wn.join(' · ') : 'podle šablony z manuálu'; hnt.style.color = c2.wn.length ? 'var(--warn)' : ''; };
  refresh();
  body.oninput = e => {
    const f = e.target.dataset.f; if (!f || !f.startsWith('cap.')) return;
    p.caption[f.slice(4)] = e.target.value; p.updated = Date.now(); save(); refresh();
  };
  body.onclick = async e => {
    const tg = e.target.closest('.tg');
    if (tg) { const on = tg.getAttribute('aria-checked') !== 'true'; tg.setAttribute('aria-checked', on); p.caption.short = on; save(); refresh(); return; }
    const b = e.target.closest('[data-x]'); if (!b) return;
    const x = b.dataset.x; const base = slug(postTitle(p)); const label = b.textContent;
    const reset = () => { b.disabled = false; b.textContent = label; };
    try {
      if (x === 'copy') {
        const t = buildCaption(p).text;
        try { await navigator.clipboard.writeText(t); toast('Popisek zkopírován'); }
        catch (err) { const r = document.createRange(); r.selectNodeContents($('cap-out')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Označeno, zkopíruj ručně'); }
        return;
      }
      b.disabled = true;
      if (x === 'one') { const s = curSlide(); const i = p.slides.indexOf(s); await saveFile(`${base}-${String(i + 1).padStart(2, '0')}.png`, await slideBlob(s, p)); toast('Slide uložen'); }
      else if (x === 'all') { for (let i = 0; i < n; i++) { b.textContent = `Ukládám ${i + 1} / ${n}…`; await saveFile(`${base}-${String(i + 1).padStart(2, '0')}.png`, await slideBlob(p.slides[i], p)); } toast('Všechny slidy uloženy'); }
      else if (x === 'contact') { b.textContent = 'Skládám…'; await saveFile(`${base}-kontakt.png`, await contactBlob(p)); toast('Kontaktní list uložen'); }
      else if (x === 'zip') {
        if (typeof JSZip === 'undefined') { toast('ZIP knihovna se nenačetla, ulož slidy po jednom.'); reset(); return; }
        b.textContent = 'Balím…';
        const z = new JSZip();
        for (let i = 0; i < n; i++) z.file(`${base}-${String(i + 1).padStart(2, '0')}.png`, await slideBlob(p.slides[i], p));
        z.file('popisek.txt', buildCaption(p).text);
        await saveFile(`${base}.zip`, await z.generateAsync({ type: 'blob' })); toast('ZIP uložen');
      }
      reset();
    } catch (err) {
      reset();
      const code = err && err.code;
      if (code === 'declined') toast('Ukládání zrušeno');
      else if (code === 'rate_limited') toast('Počkej chvíli a zkus to znovu');
      else toast('Soubor se nepodařilo uložit' + (err && err.message ? ': ' + err.message : ''));
    }
  };
}
$('btn-export').onclick = exportSheet;
